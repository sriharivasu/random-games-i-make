<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6th Grade Math Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #FFD166;
    --orange: #FF6B35;
    --teal: #06D6A0;
    --navy: #073B4C;
    --sky: #118AB2;
    --pink: #EF476F;
    --light: #F7F9FB;
    --card: #FFFFFF;
    --text: #073B4C;
    --muted: #5A7A8A;
    --radius: 18px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--navy);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    background: var(--navy);
    padding: 24px 24px 16px;
    text-align: center;
    border-bottom: 4px solid var(--yellow);
  }

  header h1 {
    font-family: 'Fredoka One', sans-serif;
    font-size: 2.2rem;
    color: var(--yellow);
    letter-spacing: 1px;
    line-height: 1.1;
  }

  header p {
    color: #A8C8D8;
    font-size: 0.9rem;
    margin-top: 4px;
    font-weight: 600;
  }

  /* ── Timer settings bar ── */
  .settings-bar {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .settings-bar label {
    color: #A8C8D8;
    font-size: 0.85rem;
    font-weight: 700;
  }

  .timer-input {
    width: 64px;
    padding: 5px 8px;
    border-radius: 8px;
    border: 1.5px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.1);
    color: #fff;
    font-family: 'Nunito', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    text-align: center;
  }

  .timer-input:focus { outline: none; border-color: var(--yellow); }

  .apply-btn {
    background: var(--yellow);
    color: var(--navy);
    border: none;
    border-radius: 8px;
    padding: 6px 14px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.82rem;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .apply-btn:hover { transform: scale(1.04); }

  .stats-bar {
    display: flex;
    gap: 12px;
    justify-content: center;
    padding: 12px 20px;
    background: rgba(255,255,255,0.05);
    width: 100%;
    flex-wrap: wrap;
  }

  .stat-pill {
    background: rgba(255,255,255,0.1);
    border: 1.5px solid rgba(255,255,255,0.15);
    border-radius: 30px;
    padding: 5px 16px;
    color: #fff;
    font-size: 0.88rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .stat-pill span { color: var(--yellow); }

  main {
    width: 100%;
    max-width: 800px;
    padding: 20px 16px 60px;
  }

  .category-filter {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    margin-bottom: 18px;
    justify-content: center;
  }

  .cat-btn {
    background: rgba(255,255,255,0.08);
    border: 1.5px solid rgba(255,255,255,0.15);
    border-radius: 30px;
    color: #cde;
    font-family: 'Nunito', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    padding: 5px 12px;
    cursor: pointer;
    transition: all 0.16s;
  }

  .cat-btn:hover, .cat-btn.active {
    background: var(--yellow);
    border-color: var(--yellow);
    color: var(--navy);
  }

  /* ── Quiz card — flashes green on correct ── */
  .quiz-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 26px 26px 22px;
    position: relative;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    transition: background 0.25s, box-shadow 0.25s;
  }

  .quiz-card.flash-correct {
    background: #C8F7E3;
    box-shadow: 0 0 0 4px var(--teal), 0 8px 32px rgba(0,0,0,0.2);
  }

  .quiz-card.flash-wrong {
    background: #FFE0E8;
    box-shadow: 0 0 0 4px var(--pink), 0 8px 32px rgba(0,0,0,0.2);
  }

  .topic-badge {
    display: inline-block;
    background: var(--sky);
    color: #fff;
    font-size: 0.72rem;
    font-weight: 800;
    padding: 3px 11px;
    border-radius: 20px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .question-text {
    font-size: 1.12rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1.5;
    margin-bottom: 18px;
  }

  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 18px;
  }

  .option-btn {
    background: var(--light);
    border: 2px solid #DDE6EC;
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.93rem;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
    line-height: 1.4;
  }

  .option-btn:hover:not(:disabled) {
    border-color: var(--sky);
    background: #E8F4FA;
  }

  .option-btn.correct {
    background: #C8F7E3;
    border-color: var(--teal);
    color: #025E44;
    font-weight: 800;
  }

  .option-btn.wrong {
    background: #FFE4EA;
    border-color: var(--pink);
    color: #8B0020;
  }

  .option-btn.reveal-correct {
    background: #C8F7E3;
    border-color: var(--teal);
    color: #025E44;
    font-weight: 800;
  }

  .open-answer-section { margin-bottom: 16px; }

  .open-answer-section label {
    display: block;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .open-answer-input {
    width: 100%;
    padding: 11px 13px;
    border: 2px solid #DDE6EC;
    border-radius: var(--radius-sm);
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
    transition: border-color 0.15s;
  }

  .open-answer-input:focus { outline: none; border-color: var(--sky); }

  .work-area { margin-bottom: 16px; }

  .work-area label {
    display: block;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .work-area textarea {
    width: 100%;
    height: 90px;
    padding: 11px 13px;
    border: 2px solid #DDE6EC;
    border-radius: var(--radius-sm);
    font-family: 'Nunito', sans-serif;
    font-size: 0.88rem;
    color: var(--text);
    resize: vertical;
    background: #FAFBFC;
  }

  .work-area textarea:focus { outline: none; border-color: var(--sky); }

  .timer-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .timer-display {
    font-family: 'Fredoka One', sans-serif;
    font-size: 1.9rem;
    color: var(--orange);
    min-width: 44px;
    line-height: 1;
  }

  .timer-display.urgent { color: var(--pink); animation: pulse 0.5s ease infinite alternate; }

  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }

  .timer-bar-wrap {
    flex: 1;
    height: 8px;
    background: #EEF2F5;
    border-radius: 4px;
    overflow: hidden;
  }

  .timer-bar {
    height: 100%;
    background: var(--teal);
    border-radius: 4px;
    transition: width 0.92s linear, background 0.3s;
  }

  .timer-bar.warning { background: var(--orange); }
  .timer-bar.danger  { background: var(--pink); }

  /* ── Answer reveal ── */
  .answer-reveal {
    background: #F0FBF6;
    border: 2px solid var(--teal);
    border-radius: var(--radius-sm);
    padding: 12px 15px;
    margin-top: 12px;
    display: none;
  }

  .answer-reveal.show { display: block; }
  .answer-reveal .ar-label { font-size: 0.78rem; font-weight: 800; color: #025E44; text-transform: uppercase; letter-spacing: 0.5px; }
  .answer-reveal .ar-value { font-size: 1rem; font-weight: 700; color: var(--text); margin-top: 3px; }

  /* ── Explanation dropdown ── */
  .explain-toggle {
    background: none;
    border: none;
    color: var(--sky);
    font-family: 'Nunito', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    padding: 6px 0 0;
    display: none;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .explain-toggle.show { display: inline-block; }

  .explain-box {
    background: #EDF6FF;
    border: 1.5px solid #B5D4F4;
    border-radius: var(--radius-sm);
    padding: 11px 14px;
    margin-top: 8px;
    font-size: 0.9rem;
    color: #0C447C;
    line-height: 1.55;
    display: none;
  }

  .explain-box.show { display: block; }

  /* ── Feedback message ── */
  .feedback-msg {
    text-align: center;
    font-size: 1.15rem;
    font-weight: 800;
    padding: 6px 0 0;
    display: none;
  }
  .feedback-msg.show { display: block; }
  .feedback-msg.correct-msg { color: #019966; }
  .feedback-msg.wrong-msg   { color: var(--pink); }

  .q-counter {
    font-size: 0.78rem;
    font-weight: 800;
    color: var(--muted);
    text-align: right;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* ── Buttons ── */
  .btn-row {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
    margin-top: 14px;
  }

  .btn {
    font-family: 'Nunito', sans-serif;
    font-size: 0.92rem;
    font-weight: 800;
    border: none;
    border-radius: var(--radius-sm);
    padding: 11px 20px;
    cursor: pointer;
    transition: transform 0.12s, opacity 0.12s;
    flex: 1;
    min-width: 100px;
  }

  .btn:hover  { transform: translateY(-1px); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn-primary { background: var(--sky);    color: #fff; }
  .btn-reveal  { background: var(--orange); color: #fff; }
  .btn-next    { background: var(--teal);   color: #073B4C; }
  .btn-skip    { background: #EEF2F5;       color: var(--muted); }

  /* ── End screen ── */
  .end-screen {
    text-align: center;
    padding: 40px 20px;
    display: none;
  }
  .end-screen.show { display: block; }

  .end-screen .score-big {
    font-family: 'Fredoka One', sans-serif;
    font-size: 5rem;
    color: var(--yellow);
    line-height: 1;
  }

  .end-screen .score-label {
    font-size: 1rem;
    color: #A8C8D8;
    margin-top: 6px;
    font-weight: 700;
  }

  .end-screen .grade-msg {
    font-size: 1.35rem;
    font-weight: 800;
    color: #fff;
    margin: 18px 0;
  }

  .end-screen .btn-restart {
    background: var(--yellow);
    color: var(--navy);
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 800;
    border: none;
    border-radius: var(--radius-sm);
    padding: 13px 32px;
    cursor: pointer;
    transition: transform 0.12s;
    margin-top: 8px;
  }

  .end-screen .btn-restart:hover { transform: scale(1.04); }

  @media (max-width: 500px) {
    .options-grid { grid-template-columns: 1fr; }
    header h1    { font-size: 1.7rem; }
    .quiz-card   { padding: 18px 14px 16px; }
    .btn-row     { flex-direction: column; }
  }
</style>
</head>
<body>

<header>
  <h1>📐 6th Grade Math Quiz</h1>
  <p>Answer fast · Show your work · Review mistakes</p>
</header>

<!-- Timer settings -->
<div class="settings-bar">
  <label for="timerSetting">⏱ Timer (seconds):</label>
  <input type="number" id="timerSetting" class="timer-input" value="15" min="5" max="120" />
  <button class="apply-btn" onclick="applyTimerSetting()">Apply</button>
</div>

<div class="stats-bar">
  <div class="stat-pill">Question <span id="qNum">1</span> of <span id="qTotal">—</span></div>
  <div class="stat-pill">✅ Correct: <span id="scoreVal">0</span></div>
  <div class="stat-pill">❌ Wrong: <span id="wrongVal">0</span></div>
  <div class="stat-pill">Topic: <span id="topicVal">—</span></div>
</div>

<main>
  <div class="category-filter" id="catFilter"></div>

  <div class="quiz-card" id="quizCard">
    <div class="q-counter" id="qCounter"></div>
    <div class="topic-badge" id="topicBadge"></div>
    <div class="question-text" id="questionText"></div>

    <div class="timer-row">
      <div class="timer-display" id="timerDisplay">15</div>
      <div class="timer-bar-wrap"><div class="timer-bar" id="timerBar"></div></div>
    </div>

    <div id="optionsArea"></div>

    <div class="work-area">
      <label>✏️ Show your work</label>
      <textarea id="workArea" placeholder="Write out your steps, scratch work, or reasoning..."></textarea>
    </div>

    <div class="answer-reveal" id="answerReveal">
      <div class="ar-label">Correct Answer</div>
      <div class="ar-value" id="revealValue"></div>
    </div>

    <button class="explain-toggle" id="explainToggle" onclick="toggleExplain()">▶ Why is this the answer?</button>
    <div class="explain-box" id="explainBox"></div>

    <div class="feedback-msg" id="feedbackMsg"></div>

    <!-- Next only shows on wrong/skip/time-up. Reveal & Skip always visible. -->
    <div class="btn-row" id="btnRow">
      <button class="btn btn-skip"   id="btnSkip"   onclick="skipQuestion()">Skip</button>
      <button class="btn btn-reveal" id="btnReveal" onclick="revealAnswer()">Reveal Answer</button>
      <button class="btn btn-next"   id="btnNext"   onclick="nextQuestion()" style="display:none;">Next →</button>
    </div>
  </div>

  <div class="end-screen" id="endScreen">
    <div class="score-big"  id="finalScore"></div>
    <div class="score-label" id="finalLabel"></div>
    <div class="grade-msg"  id="gradeMsg"></div>
    <button class="btn-restart" onclick="restartQuiz()">🔄 Play Again</button>
  </div>
</main>

<script>
/* =====================================================================
   QUESTION BANK
   explanation field: shown on demand in the "Why?" dropdown
   ===================================================================== */
const ALL_QUESTIONS = [
  // Ratios & Proportions
  { topic:"Ratios & Proportions", q:"A car travels at 60 miles per hour. How far will it travel in 20 minutes?", type:"open", answer:"20 miles", explanation:"60 miles per HOUR ÷ 60 minutes = 1 mile/min. 1 mile/min × 20 min = 20 miles." },
  { topic:"Ratios & Proportions", q:"At a zoo there are 3 lions for every 7 tigers. Which total could be the zoo's count?", type:"mc", options:["21 lions and 49 tigers","25 lions and 63 tigers","32 lions and 70 tigers","33 lions and 78 tigers"], answer:"A", explanation:"3:7 → multiply both by 7 → 21:49. That keeps the ratio equivalent." },
  { topic:"Ratios & Proportions", q:"Chocolate chip to oatmeal raisin is 5:4. What is the ratio of oatmeal raisin to TOTAL cookies?", type:"mc", options:["5:4","4:5","4:9","5:9"], answer:"C", explanation:"Total parts = 5+4 = 9. Oatmeal raisin = 4 parts. Ratio = 4:9." },
  { topic:"Ratios & Proportions", q:"The ratio of x to y is constant. x=10→y=15, x=12→y=18. What is y when x=16?", type:"mc", options:["20","24","25","30"], answer:"B", explanation:"y/x = 15/10 = 1.5. So y = 1.5 × 16 = 24." },
  { topic:"Ratios & Proportions", q:"A store sells apples at $4 for 8. Which TWO prices are equivalent?", type:"open", answer:"$10 for 20 apples AND $6 for 12 apples", explanation:"Unit rate = $0.50/apple. $10÷20=0.50 ✓ and $6÷12=0.50 ✓." },
  { topic:"Ratios & Proportions", q:"If 5 pounds of flour equals 80 ounces, what is the ratio of pounds to ounces?", type:"mc", options:["80:5","1:16","16:1","10:80"], answer:"B", explanation:"5 lbs : 80 oz → simplify ÷5 → 1:16." },
  { topic:"Ratios & Proportions", q:"A car travels 180 miles in 3 hours. What is the unit rate in miles per hour?", type:"mc", options:["45 mph","50 mph","55 mph","60 mph"], answer:"D", explanation:"180 ÷ 3 = 60 mph." },
  { topic:"Ratios & Proportions", q:"Jackson has 16 feet of string. How many yards? (3 ft = 1 yd)", type:"mc", options:["16/3 yards","8/3 yards","5/2 yards","7/3 yards"], answer:"A", explanation:"16 ÷ 3 = 16/3 yards ≈ 5.33 yards." },
  { topic:"Ratios & Proportions", q:"A pet store sells cats and dogs at ratio 7:2. How many dogs if 81 total were sold?", type:"mc", options:["9","27","36","18"], answer:"D", explanation:"Total parts = 9. Each part = 81÷9 = 9. Dogs = 2×9 = 18." },
  { topic:"Ratios & Proportions", q:"120 fans for home, 80 for visiting. Ratio of home fans to total fans?", type:"mc", options:["2:5","3:4","3:5","4:5"], answer:"C", explanation:"Total = 200. Home = 120. 120:200 = 3:5." },
  { topic:"Ratios & Proportions", q:"Ethan is 70.8 inches tall. If 1 inch = 2.54 cm, what is his height in cm?", type:"mc", options:["175.8 cm","179.8 cm","181.2 cm","183.5 cm"], answer:"C", explanation:"70.8 × 2.54 = 179.832 ≈ 181.2 cm." },
  { topic:"Ratios & Proportions", q:"A bakery produces 4.5 dozen cookies per hour. How long to bake 72 dozen?", type:"mc", options:["12 hours","18 hours","20 hours","16 hours"], answer:"D", explanation:"72 ÷ 4.5 = 16 hours." },
  { topic:"Ratios & Proportions", q:"Which ratio is equivalent to 4:7?", type:"mc", options:["10:16","6:10","12:24","8:14"], answer:"D", explanation:"4×2=8 and 7×2=14 → 8:14 ✓." },
  { topic:"Ratios & Proportions", q:"45 voted for Alex, 30 for Jordan. Ratio of Alex votes to total votes?", type:"mc", options:["3:2","3:5","5:8","2:3"], answer:"B", explanation:"Total = 75. Alex = 45. 45:75 = 3:5." },

  // Percents
  { topic:"Percents", q:"Marie finished 15 of 25 chapters (60%). Sam's book has 35 chapters. How many has Sam finished?", type:"open", answer:"21 chapters", explanation:"60% of 35 = 0.60 × 35 = 21 chapters." },
  { topic:"Percents", q:"3 pieces of cake = 25% of the cake. How many total pieces?", type:"mc", options:["9","12","15","18"], answer:"B", explanation:"3 = 25% → 1% = 3/25 → 100% = 12 pieces." },
  { topic:"Percents", q:"Michael earns $600/week and spends 20% on groceries. How much on groceries?", type:"mc", options:["$80","$90","$100","$120"], answer:"D", explanation:"$600 × 0.20 = $120." },
  { topic:"Percents", q:"If 60% of n is 300, what is 80% of n?", type:"mc", options:["600","800","400","480"], answer:"C", explanation:"n = 300 ÷ 0.60 = 500. 80% of 500 = 400." },
  { topic:"Percents", q:"150 of 600 students play an instrument. What percent?", type:"mc", options:["20%","25%","33.3%","50%"], answer:"B", explanation:"150/600 = 0.25 = 25%." },
  { topic:"Percents", q:"Sophia bought a book for $15. Sales tax is 6%. Total paid?", type:"open", answer:"$15.90", explanation:"Tax = $15 × 0.06 = $0.90. Total = $15 + $0.90 = $15.90." },
  { topic:"Percents", q:"52 is 80% of what number?", type:"mc", options:["60","65","70","75"], answer:"B", explanation:"n = 52 ÷ 0.80 = 65." },
  { topic:"Percents", q:"A football team won 40% of their 25 games. How many games did they win?", type:"mc", options:["8","9","10","12"], answer:"C", explanation:"25 × 0.40 = 10 games." },
  { topic:"Percents", q:"36 campers = 45% of all campers. How many campers total?", type:"mc", options:["80","75","70","85"], answer:"A", explanation:"n = 36 ÷ 0.45 = 80 campers." },
  { topic:"Percents", q:"Ethan bought a bicycle for $250. Sales tax = 9%. Total paid?", type:"open", answer:"$272.50", explanation:"Tax = $250 × 0.09 = $22.50. Total = $272.50." },
  { topic:"Percents", q:"A student answered 85% of 40 questions correctly. How many correct?", type:"mc", options:["30","32","34","36"], answer:"C", explanation:"40 × 0.85 = 34." },
  { topic:"Percents", q:"35 is approximately what percent of 140?", type:"mc", options:["20%","25%","30%","35%"], answer:"B", explanation:"35/140 = 0.25 = 25%." },
  { topic:"Percents", q:"48 is 60% of what number?", type:"open", answer:"80", explanation:"n = 48 ÷ 0.60 = 80." },
  { topic:"Percents", q:"David earned 75% on a test and got 30 correct. How many total questions?", type:"mc", options:["35","38","40","45"], answer:"C", explanation:"n = 30 ÷ 0.75 = 40." },

  // LCM & GCF
  { topic:"LCM & GCF", q:"What is the prime factorization of 120?", type:"mc", options:["13×17","2²×3²×5","5²×17","2³×3×5"], answer:"D", explanation:"120 = 8×15 = 2³ × 3 × 5." },
  { topic:"LCM & GCF", q:"Which pair has LCM = 36?", type:"mc", options:["6 and 12","9 and 18","4 and 3","12 and 18"], answer:"D", explanation:"LCM(12,18): multiples of 18 → 18, 36. Is 36 a multiple of 12? Yes ✓." },
  { topic:"LCM & GCF", q:"Which expression equals 56 + 32 by factoring out the GCF?", type:"mc", options:["8(7+4)","4(14+8)","2(28+16)","6(10+4)"], answer:"A", explanation:"GCF(56,32)=8. 56÷8=7, 32÷8=4 → 8(7+4)." },
  { topic:"LCM & GCF", q:"Julia runs every 8 days, Marta every 12 days. Days until they run together again?", type:"mc", options:["16","24","32","40"], answer:"B", explanation:"LCM(8,12)=24 days." },
  { topic:"LCM & GCF", q:"What is the prime factorization of 210?", type:"mc", options:["2·5²","2·3³","2²·5²","2·3·5·7"], answer:"D", explanation:"210 = 2 × 105 = 2 × 3 × 35 = 2 × 3 × 5 × 7." },
  { topic:"LCM & GCF", q:"What is the GCF of 48 and 72?", type:"mc", options:["6","24","12","36"], answer:"B", explanation:"Factors of 48: 1,2,3,4,6,8,12,16,24,48. Factors of 72: …24… GCF = 24." },

/* =====================================================================
   STATE
   ===================================================================== */
const TOPICS = ["All", ...new Set(ALL_QUESTIONS.map(q => q.topic))];

let questions     = [];
let currentIdx    = 0;
let score         = 0;
let wrong         = 0;
let timerInterval = null;
let maxTime       = 15;   // configurable
let timeLeft      = 15;
let answered      = false;
let selectedTopic = "All";
let explainOpen   = false;

/* =====================================================================
   TIMER SETTING
   ===================================================================== */
function applyTimerSetting() {
  const val = parseInt(document.getElementById("timerSetting").value, 10);
  if (!isNaN(val) && val >= 5 && val <= 120) {
    maxTime = val;
    // restart so the new setting takes effect immediately
    startQuiz();
  }
}

/* =====================================================================
   HELPERS
   ===================================================================== */
function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function $(id) { return document.getElementById(id); }

function updateStats() {
  $("scoreVal").textContent = score;
  $("wrongVal").textContent = wrong;
}

/* =====================================================================
   CATEGORIES
   ===================================================================== */
function buildCategories() {
  const c = $("catFilter");
  c.innerHTML = "";
  TOPICS.forEach(t => {
    const btn = document.createElement("button");
    btn.className = "cat-btn" + (t === selectedTopic ? " active" : "");
    btn.textContent = t;
    btn.onclick = () => {
      selectedTopic = t;
      document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      startQuiz();
    };
    c.appendChild(btn);
  });
}

/* =====================================================================
   START / LOAD
   ===================================================================== */
function startQuiz() {
  const pool = selectedTopic === "All"
    ? ALL_QUESTIONS
    : ALL_QUESTIONS.filter(q => q.topic === selectedTopic);
  questions  = shuffleArray(pool);
  currentIdx = 0;
  score      = 0;
  wrong      = 0;
  updateStats();
  $("qTotal").textContent = questions.length;
  $("endScreen").classList.remove("show");
  $("quizCard").style.display = "block";
  loadQuestion();
}

function loadQuestion() {
  if (currentIdx >= questions.length) { showEndScreen(); return; }

  answered    = false;
  explainOpen = false;
  clearInterval(timerInterval);
  timeLeft = maxTime;

  const q = questions[currentIdx];
  $("qNum").textContent      = currentIdx + 1;
  $("qCounter").textContent  = `Question ${currentIdx + 1} of ${questions.length}`;
  $("topicBadge").textContent = q.topic;
  $("topicVal").textContent   = q.topic;
  $("questionText").textContent = q.q;

  // timer reset
  $("timerDisplay").textContent   = maxTime;
  $("timerDisplay").className     = "timer-display";
  $("timerBar").style.width       = "100%";
  $("timerBar").className         = "timer-bar";
  $("timerBar").style.transition  = "none";
  setTimeout(() => { $("timerBar").style.transition = ""; }, 50);

  // clear UI state
  $("workArea").value = "";
  $("answerReveal").classList.remove("show");
  $("explainToggle").classList.remove("show");
  $("explainBox").classList.remove("show");
  $("explainBox").textContent = "";
  $("feedbackMsg").classList.remove("show");
  $("feedbackMsg").className  = "feedback-msg";
  $("quizCard").className     = "quiz-card";

  // Next button: HIDDEN until wrong/skip/time-up
  $("btnNext").style.display = "none";
  $("btnSkip").disabled      = false;
  $("btnReveal").disabled    = false;

  // Build answer area
  const area = $("optionsArea");
  area.innerHTML = "";

  if (q.type === "mc") {
    const grid = document.createElement("div");
    grid.className = "options-grid";
    ["A","B","C","D"].forEach((letter, i) => {
      const btn       = document.createElement("button");
      btn.className   = "option-btn";
      btn.textContent = `${letter}. ${q.options[i]}`;
      btn.onclick     = () => checkMC(i, letter, btn);
      grid.appendChild(btn);
    });
    area.appendChild(grid);
  } else {
    const wrap = document.createElement("div");
    wrap.className = "open-answer-section";
    wrap.innerHTML = `<label>Your Answer</label>
      <input type="text" class="open-answer-input" id="openInput" placeholder="Type your answer..." autocomplete="off" />`;
    area.appendChild(wrap);

    const checkBtn       = document.createElement("button");
    checkBtn.className   = "btn btn-primary";
    checkBtn.id          = "checkOpenBtn";
    checkBtn.textContent = "Check Answer";
    checkBtn.style.marginBottom = "12px";
    checkBtn.onclick     = checkOpen;
    area.appendChild(checkBtn);

    setTimeout(() => {
      const inp = $("openInput");
      if (inp) inp.addEventListener("keydown", e => { if (e.key === "Enter") checkOpen(); });
    }, 0);
  }

  startTimer();
}

/* =====================================================================
   TIMER
   ===================================================================== */
function startTimer() {
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      if (!answered) timeUp();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const pct  = (timeLeft / maxTime) * 100;
  const disp = $("timerDisplay");
  const bar  = $("timerBar");

  disp.textContent  = timeLeft;
  bar.style.width   = pct + "%";

  const urgentThresh  = Math.min(5, Math.floor(maxTime * 0.2));
  const warningThresh = Math.min(8, Math.floor(maxTime * 0.4));

  if (timeLeft <= urgentThresh) {
    disp.className = "timer-display urgent";
    bar.className  = "timer-bar danger";
  } else if (timeLeft <= warningThresh) {
    disp.className = "timer-display";
    bar.className  = "timer-bar warning";
  } else {
    disp.className = "timer-display";
    bar.className  = "timer-bar";
  }
}

/* =====================================================================
   ANSWER CHECKING
   ===================================================================== */
function checkMC(idx, letter, clickedBtn) {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval);

  const q    = questions[currentIdx];
  const all  = document.querySelectorAll(".option-btn");
  const isCorrect = letter === q.answer;

  all.forEach(b => b.disabled = true);

  if (isCorrect) {
    // ── CORRECT path ──
    score++;
    updateStats();
    clickedBtn.classList.add("correct");
    $("quizCard").classList.add("flash-correct");
    $("feedbackMsg").textContent = "✅ Correct!";
    $("feedbackMsg").classList.add("show", "correct-msg");

    // auto-advance after 1 second — no Next button shown
    setTimeout(() => {
      currentIdx++;
      loadQuestion();
    }, 1000);

  } else {
    // ── WRONG path ──
    wrong++;
    updateStats();
    clickedBtn.classList.add("wrong");
    $("quizCard").classList.add("flash-wrong");

    // highlight the correct one
    const correctIdx = ["A","B","C","D"].indexOf(q.answer);
    if (all[correctIdx]) all[correctIdx].classList.add("reveal-correct");

    $("feedbackMsg").textContent = "❌ Not quite!";
    $("feedbackMsg").classList.add("show", "wrong-msg");

    // show answer panel
    $("answerReveal").classList.add("show");
    $("revealValue").textContent = `${q.answer}. ${q.options[correctIdx]}`;

    // show explanation toggle
    setupExplain(q);

    // show Next button
    $("btnNext").style.display = "";
  }
}

function checkOpen() {
  if (answered) return;
  const inp = $("openInput");
  if (!inp || !inp.value.trim()) return;
  answered = true;
  clearInterval(timerInterval);

  const q = questions[currentIdx];

  // Disable input and check button
  inp.disabled = true;
  const cb = $("checkOpenBtn");
  if (cb) cb.disabled = true;

  // For open-response we always show the answer and let them self-grade
  $("answerReveal").classList.add("show");
  $("revealValue").textContent = q.answer;

  $("feedbackMsg").textContent = "📋 Check your answer below!";
  $("feedbackMsg").classList.add("show");
  setupExplain(q);
  $("btnNext").style.display = "";
}

function revealAnswer() {
  if (answered) return;   // already handled
  answered = true;
  clearInterval(timerInterval);

  const q = questions[currentIdx];
  disableOptions();

  $("answerReveal").classList.add("show");
  $("revealValue").textContent = q.type === "mc"
    ? `${q.answer}. ${q.options[["A","B","C","D"].indexOf(q.answer)]}`
    : q.answer;

  // Highlight the correct MC option
  if (q.type === "mc") {
    const all = document.querySelectorAll(".option-btn");
    const ci  = ["A","B","C","D"].indexOf(q.answer);
    if (all[ci]) all[ci].classList.add("reveal-correct");
  }

  wrong++;
  updateStats();
  $("quizCard").classList.add("flash-wrong");
  $("feedbackMsg").textContent = "👀 Answer revealed — marked wrong.";
  $("feedbackMsg").classList.add("show", "wrong-msg");
  setupExplain(q);
  $("btnNext").style.display = "";
}

function timeUp() {
  if (answered) return;
  answered = true;
  wrong++;
  updateStats();
  disableOptions();

  const q = questions[currentIdx];
  $("answerReveal").classList.add("show");
  $("revealValue").textContent = q.type === "mc"
    ? `${q.answer}. ${q.options[["A","B","C","D"].indexOf(q.answer)]}`
    : q.answer;

  if (q.type === "mc") {
    const all = document.querySelectorAll(".option-btn");
    const ci  = ["A","B","C","D"].indexOf(q.answer);
    if (all[ci]) all[ci].classList.add("reveal-correct");
  }

  $("quizCard").classList.add("flash-wrong");
  $("feedbackMsg").textContent = "⏰ Time's up!";
  $("feedbackMsg").classList.add("show", "wrong-msg");
  setupExplain(q);
  $("btnNext").style.display = "";
}

/* =====================================================================
   EXPLANATION DROPDOWN
   ===================================================================== */
function setupExplain(q) {
  if (q.explanation) {
    $("explainBox").textContent = q.explanation;
    $("explainToggle").classList.add("show");
    $("explainToggle").textContent = "▶ Why is this the answer?";
    explainOpen = false;
  }
}

function toggleExplain() {
  explainOpen = !explainOpen;
  $("explainBox").classList.toggle("show", explainOpen);
  $("explainToggle").textContent = explainOpen
    ? "▼ Hide explanation"
    : "▶ Why is this the answer?";
}

/* =====================================================================
   NAV
   ===================================================================== */
function skipQuestion() {
  if (answered) { nextQuestion(); return; }
  clearInterval(timerInterval);
  wrong++;
  updateStats();
  answered = true;
  disableOptions();
  $("quizCard").classList.add("flash-wrong");
  $("feedbackMsg").textContent = "⏭ Skipped";
  $("feedbackMsg").classList.add("show", "wrong-msg");

  const q = questions[currentIdx];
  $("answerReveal").classList.add("show");
  $("revealValue").textContent = q.type === "mc"
    ? `${q.answer}. ${q.options[["A","B","C","D"].indexOf(q.answer)]}`
    : q.answer;
  if (q.type === "mc") {
    const all = document.querySelectorAll(".option-btn");
    const ci  = ["A","B","C","D"].indexOf(q.answer);
    if (all[ci]) all[ci].classList.add("reveal-correct");
  }
  setupExplain(q);
  $("btnNext").style.display = "";
}

function nextQuestion() {
  clearInterval(timerInterval);
  currentIdx++;
  if (currentIdx >= questions.length) { showEndScreen(); return; }
  loadQuestion();
}

function disableOptions() {
  document.querySelectorAll(".option-btn").forEach(b => b.disabled = true);
  const inp = $("openInput");
  if (inp) inp.disabled = true;
  const cb = $("checkOpenBtn");
  if (cb) cb.disabled = true;
}

/* =====================================================================
   END SCREEN
   ===================================================================== */
function showEndScreen() {
  $("quizCard").style.display = "none";
  const pct = questions.length > 0 ? Math.round((score / questions.length) * 100) : 0;
  $("finalScore").textContent = `${score}/${questions.length}`;
  $("finalLabel").textContent = `${pct}% correct`;
  let msg = "";
  if (pct >= 90) msg = "🏆 Outstanding! You're a math star!";
  else if (pct >= 75) msg = "🎉 Great work! Keep it up!";
  else if (pct >= 60) msg = "📚 Good effort — review & retry!";
  else msg = "💪 Keep practicing — you've got this!";
  $("gradeMsg").textContent = msg;
  $("endScreen").classList.add("show");
}

function restartQuiz() {
  $("endScreen").classList.remove("show");
  $("quizCard").style.display = "block";
  startQuiz();
}

/* =====================================================================
   INIT
   ===================================================================== */
buildCategories();
startQuiz();
</script>
</body>
</html>
